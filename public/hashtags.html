<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashtags - CVgator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/">CVgator</a>
            </div>
            <div class="nav-menu">
                <a href="/submissions" class="nav-link">Submissions</a>
                <a href="/hashtags" class="nav-link active">Hashtags</a>
                <a href="/recruit" class="nav-link">Recruit</a>
                <a href="/mission" class="nav-link">Mission</a>
            </div>
            <!-- Login button or user profile will be added here by JavaScript -->
        </div>
    </nav>
    
    <div class="hashtags-page-container">
        <div class="hashtags-header-box">
            <div class="page-header">
                <h1>Browse Hashtags</h1>
                <p>Select hashtags to filter CV submissions</p>
            </div>
        </div>
        
        <div class="hashtags-section">
            <div class="hashtags-controls">
                <button id="sortBtn" class="btn btn-primary" onclick="sortBySelectedTags()" disabled>
                    Select
                </button>
                <button class="btn btn-secondary" onclick="clearSelection()">
                    Clear Selection
                </button>
            </div>
            
            <div id="hashtagsGrid" class="hashtags-grid">
                <!-- Hashtags will be loaded here -->
            </div>
        </div>
    </div>
    
    <script src="navbar.js"></script>
    <script src="hashtags.js"></script>
    
    <script>
        function clearSelection() {
            selectedHashtags = [];
            document.querySelectorAll('.hashtag-card').forEach(card => {
                card.classList.remove('selected');
            });
            updateSortButton();
        }
    </script>
</body>
</html>
