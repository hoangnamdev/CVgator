<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVgator - Submissions</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/">CVgator</a>
            </div>
            <div class="nav-menu">
                <a href="/submissions" class="nav-link">Submissions</a>
                <a href="/recruit" class="nav-link">Recruit</a>
            </div>
            <!-- Login button or user profile will be added here by JavaScript -->
        </div>
    </nav>

    <div class="submissions-container">
        <div class="hashtag-sidebar">
            <h3>Popular Tags</h3>
            <ul class="hashtag-list">
                <!-- Hashtags will be loaded dynamically -->
            </ul>
            <a href="/hashtags" class="view-all-btn">View All +</a>
            <button id="sortBtn" class="sort-btn" disabled>Sort</button>
        </div>

        <div class="main-content">
            <div class="page-header">
                <h1 class="page-title">CV Submissions</h1>
                <a href="/upload" class="upload-btn">Upload CV</a>
            </div>

            <ul class="post-list" id="postList">
                <!-- Posts will be dynamically loaded here -->
            </ul>
            
            <!-- Pagination Controls -->
            <div class="pagination-container" id="paginationContainer">
                <button class="pagination-btn" id="prevBtn" disabled>
                    <span>←</span> Previous
                </button>
                <div class="pagination-info" id="paginationInfo">
                    Page 1 of 1
                </div>
                <button class="pagination-btn" id="nextBtn" disabled>
                    Next <span>→</span>
                </button>
            </div>
        </div>
    </div>

    <script src="navbar.js"></script>
    <script src="submissions.js"></script>
</body>
</html>
